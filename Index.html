<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1f2e">
<title>Sacred Gold Begleiter</title>
<style>
:root{--bg:#1b1f2e;--sf:#252a3d;--sf2:#2e344b;--ln:#3a415c;--tx:#eef0f7;--mu:#9aa2bd;--ac:#ff8a3d;--ok:#5fd08a;--bad:#ff6b6b;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}body{padding-bottom:calc(78px + var(--safe-b))}
button,input{font:inherit;color:inherit}header{position:sticky;top:0;z-index:5;background:rgba(27,31,46,.96);backdrop-filter:blur(10px);padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--ln)}
h1{font-size:15px;font-weight:600;color:var(--mu);margin:0 0 8px}h1 b{color:var(--ac);font-weight:700}.search{position:relative}.search input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);padding:0 46px 0 16px;font-size:17px;outline:none}.search input:focus{border-color:var(--ac)}.search .clr{position:absolute;right:4px;top:4px;width:42px;height:42px;border:0;background:none;color:var(--mu);font-size:22px;display:none}
main{padding:12px}.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;margin:0 0 6px;background:var(--sf);border:0;border-radius:12px;text-align:left}.row .no{color:var(--mu);font-size:13px;min-width:38px}.row .nm{flex:1;min-width:0}.row .en{font-weight:600;font-size:16.5px}.row .de{color:var(--mu);font-size:14.5px}.row .side{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.tb{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12.5px;font-weight:600;color:#fff;text-shadow:0 1px 1px #0008;white-space:nowrap}.hint,.small{color:var(--mu);font-size:13.5px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(27,31,46,.97);border-top:1px solid var(--ln);padding-bottom:var(--safe-b)}nav button{flex:1;height:64px;border:0;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}nav button .ic{font-size:21px}nav button.on{color:var(--ac)}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;display:none;padding-bottom:calc(30px + var(--safe-b))}#sheet.open{display:block}.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 8px 8px;background:rgba(27,31,46,.97);border-bottom:1px solid var(--ln)}.back,.iconbtn{height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:0;background:var(--sf);font-size:16px}.sh-top .tt{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sh-body{padding:14px}.big{font-size:26px;font-weight:700;line-height:1.15;margin:4px 0 2px}.big2{font-size:19px;color:var(--mu);margin-bottom:10px}
.card{background:var(--sf);border-radius:14px;padding:12px 14px;margin:0 0 12px}.card h3{margin:0 0 8px;font-size:15px;color:var(--ac);font-weight:700}details.card>summary{list-style:none;font-size:15px;color:var(--ac);font-weight:700;min-height:30px;display:flex;align-items:center}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:"＋";margin-left:auto;color:var(--mu)}details.card[open]>summary::after{content:"－"}
.nat{border-left:3px solid var(--ac);padding:4px 0 6px 10px;margin:0 0 10px}.plus{color:var(--ok)}.minus{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14.5px}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:500;font-size:13px}
.stat{display:grid;grid-template-columns:72px 34px 1fr;align-items:center;gap:8px;font-size:14px;margin:3px 0}.bar{height:9px;border-radius:5px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.btn{display:block;width:100%;min-height:54px;margin:0 0 8px;border-radius:12px;border:0;background:var(--sf);font-size:16.5px;text-align:left;padding:12px 16px;text-decoration:none;color:var(--tx)}.btn.pri{background:var(--ac);color:#1b1f2e;font-weight:700;text-align:center}
.warn{background:#3a2626;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
</style>
</head>
<body>
<header><h1><b>Sacred Gold</b> Complete v1.05</h1><div class="search"><input id="q" placeholder="Pokémon suchen (DE/EN)" autocomplete="off"><button class="clr" id="clr">✕</button></div></header>
<main id="list"><div class="hint">Lädt 493 Pokémon …</div></main>
<nav><button class="on" data-t="pk"><span class="ic">◓</span>Pokémon</button><button data-t="it"><span class="ic">◆</span>Items</button><button data-t="mv"><span class="ic">✦</span>TMs/Attacken</button><button data-t="ar"><span class="ic">⌖</span>Gebiete</button><button data-t="mo"><span class="ic">☰</span>Mehr</button></nav>
<div id="sheet"></div>
<script>
const SG='https://romhackguides.com/hacks/sacred-gold-storm-silver/';
const TDE={normal:'Normal',fire:'Feuer',water:'Wasser',electric:'Elektro',grass:'Pflanze',ice:'Eis',fighting:'Kampf',poison:'Gift',ground:'Boden',flying:'Flug',psychic:'Psycho',bug:'Käfer',rock:'Gestein',ghost:'Geist',dragon:'Drache',dark:'Unlicht',steel:'Stahl'};
const COL={normal:'#9a9a78',fire:'#e8762f',water:'#5a86e8',electric:'#d9b51c',grass:'#5fae45',ice:'#6ec4c4',fighting:'#b52f29',poison:'#934493',ground:'#c9a552',flying:'#9180e0',psychic:'#ee4d7d',bug:'#93a51e',rock:'#a8913a',ghost:'#6a5590',dragon:'#6634f0',dark:'#6a5446',steel:'#a3a3c0'};
const SD={'hp':'KP','attack':'Angriff','defense':'Vert.','special-attack':'Sp.-Angr.','special-defense':'Sp.-Vert.','speed':'Init.'};
const NAT=[['Adamant','Hart','Angriff','Sp.-Angriff'],['Jolly','Froh','Initiative','Sp.-Angriff'],['Modest','Mäßig','Sp.-Angriff','Angriff'],['Timid','Scheu','Initiative','Angriff'],['Bold','Kühn','Verteidigung','Angriff'],['Calm','Still','Sp.-Vert.','Angriff'],['Careful','Sacht','Sp.-Vert.','Sp.-Angriff'],['Impish','Pfiffig','Verteidigung','Sp.-Angriff']];
const DE={1:'Bisasam',2:'Bisaknosp',3:'Bisaflor',4:'Glumanda',5:'Glutexo',6:'Glurak',7:'Schiggy',8:'Schillok',9:'Turtok',25:'Pikachu',26:'Raichu',133:'Evoli',143:'Relaxo',149:'Dragoran',150:'Mewtu',151:'Mew',196:'Psiana',197:'Nachtara',212:'Scherox',248:'Despotar',376:'Metagross',445:'Knakrack',448:'Lucario',461:'Snibunna'};
const SGCH={1:['Zusätzliche Fähigkeit: Chlorophyll.','Zusätzliche Level-Up-Attacken: Sludge (Lv. 17), Nature Power (Lv. 29), Power Whip (Lv. 43).'],2:['Zusätzliche Fähigkeit: Chlorophyll.','Zusätzliche Level-Up-Attacken: Sludge (Lv. 18), Nature Power (Lv. 34), Power Whip (Lv. 49).'],3:['Zusätzliche Fähigkeit: Chlorophyll.','Zusätzliche Level-Up-Attacken: Sludge (Lv. 18), Nature Power (Lv. 34), Power Whip (Lv. 60).']};
let P=[],TAB='pk';
const $=s=>document.querySelector(s), cap=s=>s? s[0].toUpperCase()+s.slice(1):'', esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tb=t=>`<span class="tb" style="background:${COL[t]||'#666'}">${TDE[t]||cap(t)}</span>`;
async function boot(){try{let j=await fetch('https://pokeapi.co/api/v2/pokemon?limit=493').then(r=>r.json());P=j.results.map((x,i)=>({id:i+1,en:cap(x.name.replaceAll('-',' ')),de:DE[i+1]||''}));render();loadDE()}catch(e){$('#list').innerHTML='<div class="warn">Pokédex konnte nicht geladen werden.</div>'}}
async function loadDE(){try{let t=await fetch('https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species_names.csv').then(r=>r.text());t.split('\n').forEach(l=>{let m=l.match(/^(\d+),6,("([^"]*)"|[^,]*)/);if(m&&+m[1]<=493){let p=P[+m[1]-1];if(p)p.de=(m[3]??m[2]).trim()}});render()}catch(e){}}
function render(){let v=$('#q').value.trim().toLowerCase(),L=$('#list');if(TAB!=='pk'){L.innerHTML=`<div class="hint">Dieser Bereich wird als Nächstes mit den Sacred-Gold-v1.05-Daten gefüllt.</div><a class="btn pri" href="${SG}" target="_blank">Sacred-Gold-Datenbank öffnen</a>`;return}let a=P.filter(p=>!v||p.en.toLowerCase().includes(v)||(p.de||'').toLowerCase().includes(v)).slice(0,100);L.innerHTML=a.map(p=>`<button class="row" onclick="openPk(${p.id})"><span class="no">#${String(p.id).padStart(3,'0')}</span><span class="nm"><div class="en">${p.en}</div><div class="de">${p.de||'Deutsch wird geladen'}</div></span></button>`).join('')}
async function openPk(id){let p=P[id-1],s=$('#sheet');s.innerHTML=`<div class="sh-top"><button class="back" onclick="closePk()">‹ Zurück</button><div class="tt">${p.en} / ${p.de||''}</div><button class="iconbtn">☆</button></div><div class="sh-body"><div class="hint">Pokémon-Daten werden geladen …</div></div>`;s.classList.add('open');document.body.style.overflow='hidden';
try{let [d,sp]=await Promise.all([fetch('https://pokeapi.co/api/v2/pokemon/'+id).then(r=>r.json()),fetch('https://pokeapi.co/api/v2/pokemon-species/'+id).then(r=>r.json())]);let types=d.types.map(x=>x.type.name),stats=Object.fromEntries(d.stats.map(x=>[x.stat.name,x.base_stat]));let phys=stats.attack>=stats['special-attack'];let ns=phys?[NAT[0],NAT[1]]:[NAT[2],NAT[3]];let moves=d.moves.filter(x=>x.version_group_details.some(v=>v.version_group.name==='heartgold-soulsilver'&&v.move_learn_method.name==='level-up')).map(x=>{let v=x.version_group_details.find(v=>v.version_group.name==='heartgold-soulsilver'&&v.move_learn_method.name==='level-up');return [v.level_learned_at,cap(x.move.name.replaceAll('-',' '))]}).sort((a,b)=>a[0]-b[0]);let changes=SGCH[id]||[];
let h=`<div class="small">#${String(id).padStart(3,'0')}</div><div class="big">${p.en}</div><div class="big2">${p.de||''}</div><div style="margin-bottom:12px">${types.map(tb).join(' ')}</div>`;
h+=`<div class="card"><h3>Empfohlene Wesen</h3>${ns.map((n,i)=>`<div class="nat"><b>${i+1}. ${n[0]} / ${n[1]}</b><div><span class="plus">+ ${n[2]}</span> &nbsp; <span class="minus">− ${n[3]}</span></div></div>`).join('')}<div class="small">Automatische Empfehlung nach Werten; kein offizieller Sacred-Gold-Hinweis.</div></div>`;
h+=`<div class="card"><h3>Fundorte in Sacred Gold</h3><div class="small">Die vollständigen hack-spezifischen Begegnungstabellen werden noch integriert.</div><a class="btn" target="_blank" href="${SG}?q=${encodeURIComponent(p.en)}">Fundorte jetzt exakt nachschlagen</a></div>`;
h+=`<div class="card"><h3>Entwicklung</h3><div class="small">Sacred Gold verändert mehrere Evolutionsmethoden. Die v1.05-Evolutionsdaten werden noch integriert.</div></div>`;
h+=`<div class="card"><h3>Basiswerte</h3>${d.stats.map(x=>{let v=x.base_stat,c=v>=110?'#5fd08a':v>=80?'#c9d05f':v>=55?'#e8a64a':'#e86a4a';return `<div class="stat"><span class="small">${SD[x.stat.name]}</span><b>${v}</b><div class="bar"><i style="width:${Math.min(100,v/1.8)}%;background:${c}"></i></div></div>`}).join('')}<div class="small">Aktuell HG/SS-Basiswert; Sacred-Gold-Abweichungen werden separat eingepflegt.</div></div>`;
h+=`<div class="card"><h3>Fähigkeiten</h3>${d.abilities.map(x=>`<div><b>${cap(x.ability.name.replaceAll('-',' '))}</b>${x.is_hidden?' <span class="small">(versteckt)</span>':''}</div>`).join('')}</div>`;
if(changes.length)h+=`<div class="card"><h3>Sacred-Gold-Änderungen</h3>${changes.map(x=>`<div>• ${x}</div>`).join('')}</div>`;
h+=`<details class="card" open><summary>Level-Up-Attacken (${moves.length})</summary><table><tr><th>Lv.</th><th>Attacke</th></tr>${moves.map(m=>`<tr><td>${m[0]}</td><td><b>${m[1]}</b></td></tr>`).join('')}</table><div class="small">HG/SS-Grundliste; Sacred-Gold-Zusätze stehen im Änderungskasten bzw. werden in der vollständigen Datenversion zusammengeführt.</div></details>`;
h+=`<a class="btn pri" target="_blank" href="${SG}?q=${encodeURIComponent(p.en)}">Vollständige Sacred-Gold-v1.05-Daten öffnen</a>`;
s.querySelector('.sh-body').innerHTML=h}catch(e){s.querySelector('.sh-body').innerHTML='<div class="warn">Daten konnten nicht geladen werden.</div>'}}
function closePk(){$('#sheet').classList.remove('open');document.body.style.overflow=''}
$('#q').addEventListener('input',()=>{$('#clr').style.display=$('#q').value?'block':'none';render()});$('#clr').onclick=()=>{$('#q').value='';$('#clr').style.display='none';render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');TAB=b.dataset.t;$('#q').value='';$('#q').placeholder={pk:'Pokémon suchen (DE/EN)',it:'Item suchen (DE/EN)',mv:'TM-Nr., Attacke oder Fundort',ar:'Gebiet suchen',mo:'Trainer, Fähigkeit, Seite …'}[TAB];render()});
boot();
</script></body></html>
