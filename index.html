<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sacred Gold">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sacred Gold Begleiter</title>
<style>
:root{--bg:#1b1f2e;--sf:#252a3d;--sf2:#2e344b;--ln:#3a415c;--tx:#eef0f7;--mu:#9aa2bd;--ac:#ff8a3d;--ok:#5fd08a;--bad:#ff6b6b;
--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(78px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(27,31,46,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--ln)}
h1{font-size:15px;font-weight:600;color:var(--mu);margin:0 0 8px;letter-spacing:.2px}
h1 b{color:var(--ac);font-weight:700}
.search{position:relative}
.search input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);padding:0 46px 0 16px;font-size:17px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--ac)}
.search .clr{position:absolute;right:4px;top:4px;width:42px;height:42px;border:0;background:none;color:var(--mu);font-size:22px;display:none}
main{padding:12px 12px 20px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;margin:0 0 6px;background:var(--sf);border:0;border-radius:12px;text-align:left}
.row:active{background:var(--sf2)}
.row .no{color:var(--mu);font-variant-numeric:tabular-nums;font-size:13px;min-width:38px}
.row .nm{flex:1;min-width:0}
.row .en{font-weight:600;font-size:16.5px}
.row .de{color:var(--mu);font-size:14.5px}
.row .side{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.tb{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12.5px;font-weight:600;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);white-space:nowrap}
.hint{color:var(--mu);font-size:14px;padding:8px 4px}
.more{width:100%;height:50px;border-radius:12px;border:1px dashed var(--ln);background:none;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(27,31,46,.97);border-top:1px solid var(--ln);padding-bottom:var(--safe-b)}
nav button{flex:1;height:64px;border:0;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--ac)}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(30px + var(--safe-b))}
#sheet.open{display:block}
.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 8px 8px;background:rgba(27,31,46,.97);border-bottom:1px solid var(--ln)}
.back{height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:0;background:var(--sf);font-size:16px}
.sh-top .tt{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{height:46px;min-width:46px;border-radius:12px;border:0;background:var(--sf);font-size:20px}
.iconbtn.on{color:var(--ac)}
.sh-body{padding:14px}
.big{font-size:26px;font-weight:700;line-height:1.15;margin:4px 0 2px}
.big2{font-size:19px;color:var(--mu);margin-bottom:10px}
.card{background:var(--sf);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--ac);font-weight:700}
details.card>summary{list-style:none;font-size:15px;color:var(--ac);font-weight:700;min-height:30px;display:flex;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";margin-left:auto;color:var(--mu)}
details.card[open]>summary::after{content:"－"}
details.card[open]>summary{margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--mu)}.kv dd{margin:0}
.nat{border-left:3px solid var(--ac);padding:4px 0 6px 10px;margin:0 0 10px}
.nat b{font-size:16px}.nat .pm{font-size:14px;margin:2px 0}.plus{color:var(--ok)}.minus{color:var(--bad)}
.small{font-size:13.5px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:500;font-size:13px}
tr.lk:active{background:var(--sf2)}
.stat{display:grid;grid-template-columns:72px 34px 1fr;align-items:center;gap:8px;font-size:14px;margin:3px 0}
.bar{height:9px;border-radius:5px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--sf2);color:var(--mu);margin:0 4px 2px 0}
.tag.h{background:#4a3a1c;color:#ffc46b}.tag.pg{background:#2b2350;color:#b9a8ff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);font-size:15px}
.chip.on{border-color:var(--ac);background:#3d2a1e}
.btn{display:block;width:100%;min-height:54px;margin:0 0 8px;border-radius:12px;border:0;background:var(--sf);font-size:16.5px;text-align:left;padding:0 16px}
.btn.pri{background:var(--ac);color:#1b1f2e;font-weight:700;text-align:center}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:15px}
.chk input{width:26px;height:26px;accent-color:var(--ac);flex:none}
.chk.done span{text-decoration:line-through;color:var(--mu)}
.mon{border-top:1px solid var(--ln);padding:8px 0}
.guide{font-size:15px}.guide table{display:block;overflow-x:auto}.guide h1{font-size:22px}.guide h2{font-size:19px;color:var(--ac)}.guide h3{font-size:17px}
.mult{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:start;margin:4px 0}
.warn{background:#3a2626;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.okbox{background:#203528;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
@media (prefers-reduced-motion:no-preference){#sheet.open{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header>
  <h1><b>Blaze Black 2 Redux</b> v1.4.1</h1>
  <div class="search"><input id="q" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Pokémon suchen (DE/EN)"><button class="clr" id="clr" aria-label="Suche leeren">✕</button></div>
</header>
<main id="list"><div class="hint">Lädt Daten …</div></main>
<nav id="nav">
  <button data-t="pk" class="on"><span class="ic">◓</span>Pokémon</button>
  <button data-t="it"><span class="ic">◆</span>Items</button>
  <button data-t="mv"><span class="ic">✦</span>TMs/Attacken</button>
  <button data-t="ar"><span class="ic">⌖</span>Gebiete</button>
  <button data-t="mo"><span class="ic">☰</span>Mehr</button>
</nav>
<div id="sheet"></div>
<script src="app.js"></script>
</body>
</html>
