:root{--bg:#181b2b;--panel:#24283b;--panel2:#202438;--line:#3a405a;--text:#f5f6fa;--muted:#aeb4c9;--accent:#ff9b55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#202438;border-bottom:1px solid var(--line);padding:14px 16px}
.top{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.logo{font-weight:900;font-size:20px}.tag{font-size:11px;color:#111;background:var(--accent);padding:4px 7px;border-radius:8px;font-weight:800}

.card{padding:12px;cursor:pointer}.num{color:var(--muted);font-size:12px}.name{font-weight:800;margin-top:3px}.de{color:var(--muted);font-size:13px}
h1{font-size:27px;margin:6px 0}.sub{color:var(--muted)}.back{background:none;color:#d9dded;border:0;font-size:15px;padding:4px 0 12px}
.box{padding:14px;margin:12px 0}.box h2{font-size:17px;margin:0 0 12px}.pill{display:inline-block;border-radius:8px;padding:5px 9px;margin:2px;background:#353b54;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.click{cursor:pointer}.click strong{color:#ffb27e}
.note{border-left:4px solid var(--accent);padding:10px 12px;background:#201f2b;border-radius:8px;color:#dfe2ee}.small{font-size:12px;color:var(--muted)}
.tmgrid{display:grid;gap:8px}.tm{padding:12px;background:#202438;border:1px solid var(--line);border-radius:12px;cursor:pointer}.tm b{color:#ffb27e}
.stat{display:grid;grid-template-columns:105px 1fr 38px;gap:8px;align-items:center;margin:7px 0}.bar{height:9px;background:#141827;border-radius:10px;overflow:hidden}.fill{height:100%;background:#d5d8e4;border-radius:10px}
.hide{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}

function renderDex(q){let x=(q||'').toLowerCase().trim();document.getElementById('dex').innerHTML=P.filter(p=>!x||p.en.toLowerCase().includes(x)||p.de.toLowerCase().includes(x)||String(p.id).includes(x)).map(p=>`<div class="card" onclick="showPokemon(${p.id})"><div class="num">#${String(p.id).padStart(3,'0')}</div><div class="name">${esc(p.en)}</div><div class="de">${esc(p.de)}</div></div>`).join('')}
function showPokemon(id){let p=P[id-1];let ch=p.changes.length?p.changes.map(x=>`<div class="row"><span>${esc(x)}</span></div>`).join(''):`<div class="small">In Drayanos Änderungsdokument ist für dieses Pokémon in dieser eingebetteten Datenstufe keine Änderung hinterlegt.</div>`;
let types=p.types.length?p.types.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):`<span class="small">Basistyp-Datensatz wird ergänzt</span>`;
let ev=(EVOS[id]||[]).map(e=>`<div class="row click" onclick="showPokemon(${e[0]})"><span>${esc(e[1])}</span><strong>${esc(P[e[0]-1].en)} →</strong></div>`).join('')||'<div class="small">Keine hier hinterlegte direkte Entwicklung.</div>';
let mv=p.moves.length?p.moves.map(m=>`<div class="row click" onclick="showMoveByName('${String(m[1]).replaceAll("'","\\'")}')"><span>Lv. ${esc(m[0])}</span><strong>${esc(m[1])} →</strong></div>`).join(''):'<div class="small">Das vollständige Level-Up-Set ist für diesen Eintrag noch nicht eingebettet; Sacred-Gold-spezifische Änderungen stehen unten.</div>';
app.innerHTML=`<button class="back" onclick="showDex()">‹ Pokédex</button><div class="num">#${String(id).padStart(3,'0')}</div><h1>${esc(p.en)}</h1><div class="sub">${esc(p.de)}</div>
<div class="box"><h2>Typ</h2>${types}</div><div class="box"><h2>Fähigkeiten</h2>${p.ability?esc(p.ability):'<span class="small">Basisfähigkeiten werden ergänzt</span>'}</div>
<div class="box"><h2>Entwicklung</h2>${ev}</div><div class="box"><h2>Level-Up-Attacken</h2>${mv}</div>
<div class="box"><h2>Sacred-Gold-Änderungen</h2>${ch}</div>
<div class="box"><h2>TM/HM</h2><div class="small">Öffne „TMs/Attacken“ oben. Attacken sind dort einzeln anwählbar.</div></div>`}
function showTMs(){app.innerHTML=`<h1>TMs / HMs / Attacken</h1><div class="sub">Offline eingebettet · antippen für Details</div><input id="mq" class="search" placeholder="TM-Nummer oder Attacke suchen…" oninput="renderTMs(this.value)"><div id="tml" class="tmgrid" style="margin-top:14px"></div>`;renderTMs('')}
function renderTMs(q){let x=(q||'').toLowerCase();document.getElementById('tml').innerHTML=TMS.filter(t=>!x||t[0].toLowerCase().includes(x)||t[1].toLowerCase().includes(x)).map((t,i)=>`<div class="tm" onclick="showTM(${TMS.indexOf(t)})"><span class="num">${esc(t[0])}</span> <b>${esc(t[1])}</b><div class="small">${esc(t[2])} · ${esc(t[3])}</div></div>`).join('')}
function showTM(i){let t=TMS[i];app.innerHTML=`<button class="back" onclick="showTMs()">‹ TMs/Attacken</button><div class="num">${esc(t[0])}</div><h1>${esc(t[1])}</h1>
<div class="box"><div class="row"><span>Typ</span><strong>${esc(t[2])}</strong></div><div class="row"><span>Art</span><strong>${esc(t[3])}</strong></div><div class="row"><span>Stärke</span><strong>${esc(t[4])}</strong></div><div class="row"><span>Genauigkeit</span><strong>${esc(t[5])}</strong></div></div>
<div class="box"><h2>Beschreibung</h2><div>${esc(DESC[t[1]]||'Attackendetails sind lokal hinterlegt; die ausführliche deutsche Effektbeschreibung wird in der nächsten Datenstufe vervollständigt.')}</div></div>
${['Cut','Strength','Rock Smash'].includes(t[1])?'<div class="note">'+esc(DESC[t[1]])+'</div>':''}`}
function showMoveByName(n){let i=TMS.findIndex(t=>t[1].toLowerCase()===n.toLowerCase());if(i>=0)showTM(i);else app.innerHTML=`<button class="back" onclick="history.back()">‹ Zurück</button><h1>${esc(n)}</h1><div class="box">Diese Attacke ist als Sacred-Gold-Level-Up-Änderung lokal erfasst. Die vollständigen Basisdetails werden noch in den Datensatz eingepflegt.</div>`}
function showInfo(){app.innerHTML=`<h1>Über diese Datei</h1><div class="box"><h2>Offline</h2><p>Die Oberfläche, alle 493 Pokémon-Namen und der TM/HM-Katalog befinden sich direkt in dieser HTML. Beim Öffnen wird keine API und keine Fremdseite geladen.</p></div><div class="note"><b>Datenstand:</b> Die technische Vollstruktur ist jetzt für alle 493 Pokémon vorhanden. Sacred-Gold-spezifische Detaildaten werden ausschließlich aus der v1.05-Dokumentation übernommen; fehlende Daten werden ausdrücklich nicht erfunden.</div>`}
renderDex('');
</script></body></html>
